<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><title>Forms</title></head>
<body>
<!-- Netlify detects this form at deploy time. The real form lives in src/sections/Contact.tsx and posts here. Keep the field names in sync. -->
<form name="demo-request" data-netlify="true" netlify-honeypot="company" hidden>
  <input type="text" name="name">
  <input type="email" name="email">
  <input type="text" name="website">
  <input type="text" name="topic">
  <input type="text" name="invest">
  <textarea name="message"></textarea>
  <input type="text" name="consent">
  <input type="text" name="company">
</form>
</body></html>
