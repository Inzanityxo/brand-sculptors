<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ship</title>
<style>
html,body{margin:0;height:100%;background:#07081A;overflow:hidden}
#s18{position:fixed;inset:0}
.sf-canvas{display:block;width:100%;height:100%;opacity:0;transition:opacity 1.2s ease}
#s18.live .sf-canvas{opacity:1}
</style></head>
<body>
<!-- The 3D ship from Marco's keynote (Brand Sculptors blue). Embedded by the site as a lazy iframe.
     The parent sends "start" when the section is visible; the ship then builds itself in three steps. -->
<section id="s18" data-akt="0"><canvas class="sf-canvas" role="img" aria-label="A sailing ship builds itself from glowing frames and sets course for the horizon"></canvas></section>
<script>/* test switch: ?rafpoly renders in background tabs too */ if(location.search.indexOf("rafpoly")>-1){window.requestAnimationFrame=function(cb){return setTimeout(function(){cb(performance.now())},16)};}</script>
<script src="three.min.js"></script>
<script>
(function(){
  const sec = document.getElementById('s18');
  if(!sec || typeof THREE === 'undefined') return;
  const cv = sec.querySelector('.sf-canvas');
  let renderer;
  try{ renderer = new THREE.WebGLRenderer({canvas:cv, antialias:true, alpha:true, powerPreference:'high-performance'}); }
  catch(err){ return; }
  renderer.setClearColor(0x000000, 0);
  renderer.autoClear = false;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;

  const farbe = h => new THREE.Color(h).convertSRGBToLinear();
  const ROT = 0x2997FF, ROT_LICHT = 0x4FB3FF, BEIGE = 0xD9DEE8;
  const V = (x,y,z) => new THREE.Vector3(x,y,z||0);
  const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
  const glatt = (a,b,v) => { const t = clamp((v-a)/(b-a),0,1); return t*t*(3-2*t); };
  const daempfe = (a,b,rate,dt) => a + (b-a)*(1 - Math.pow(1-rate, dt*60));

  const szene  = new THREE.Scene();
  const kamera = new THREE.PerspectiveCamera(32, 2, .1, 220);
  const welt   = new THREE.Group(); szene.add(welt);      /* was sich im Wasser spiegelt */
  const flach  = new THREE.Group(); szene.add(flach);     /* Wasser, Licht, Gischt: ohne Spiegelung */

  /* ─── Studio-Umgebung für Reflexionen ─── */
  (function(){
    const s = new THREE.Scene();
    s.add(new THREE.Mesh(new THREE.BoxGeometry(24,24,24), new THREE.MeshBasicMaterial({color:farbe(0x0A0A0D), side:THREE.BackSide})));
    function leuchte(b,h,x,y,z,hex,st){
      const m = new THREE.Mesh(new THREE.PlaneGeometry(b,h), new THREE.MeshBasicMaterial({color:farbe(hex).multiplyScalar(st), side:THREE.DoubleSide}));
      m.position.set(x,y,z); m.lookAt(0,0,0); s.add(m);
    }
    leuchte(16,3,0,11,0,0xFFF3E6,5.0);
    leuchte(3,9,-11,3,-5,0xF4F0EC,2.2);
    leuchte(3,9,11,4,5,0xF4F0EC,1.6);
    leuchte(12,2,0,1.2,-11,ROT,1.6);
    leuchte(22,22,0,-11,0,0x061230,1.0);
    const pmrem = new THREE.PMREMGenerator(renderer);
    szene.environment = pmrem.fromScene(s,.035).texture; pmrem.dispose();
  })();

  szene.add(new THREE.HemisphereLight(farbe(0x2C2C33), farbe(0x05070C), .6));
  const key = new THREE.DirectionalLight(farbe(0xFFF2E2), 1.2); key.position.set(3.5,7,4); szene.add(key);
  const rim = new THREE.DirectionalLight(farbe(0xDDE3EC), .8); rim.position.set(-5,3,-4); szene.add(rim);
  const glutLicht = new THREE.PointLight(farbe(ROT_LICHT), 0, 5, 2); glutLicht.position.set(0,.4,0); szene.add(glutLicht);

  const geteilt = { uZeit:{value:0}, uScan:{value:9}, uSpiegel:{value:0}, uSpiegelTiefe:{value:1.8}, uSpiegelStaerke:{value:.32} };

  /* Jedes Material des Schiffs: Scan-Schnitt, Schnitt an der Wasserlinie, Spiegelfade */
  function rueste(m, opt){
    opt = opt || {};
    m.onBeforeCompile = shader => {
      Object.assign(shader.uniforms, geteilt);
      shader.vertexShader = shader.vertexShader
        .replace('#include <common>', '#include <common>\nvarying vec3 vWeltPos;')
        .replace('#include <worldpos_vertex>', '#include <worldpos_vertex>\nvWeltPos = (modelMatrix * vec4(transformed, 1.0)).xyz;');
      shader.fragmentShader = shader.fragmentShader
        .replace('#include <common>', '#include <common>\nvarying vec3 vWeltPos;\nuniform float uScan, uSpiegel, uSpiegelTiefe, uSpiegelStaerke;')
        .replace('#include <clipping_planes_fragment>', '#include <clipping_planes_fragment>\n' +
          'float echtY = uSpiegel > .5 ? -vWeltPos.y : vWeltPos.y; if(echtY < -0.004) discard;\n' +
          'float scanD = vWeltPos.x - uScan;\n' + (opt.scan ? 'if(scanD < 0.0) discard;\n' : ''))
        .replace('#include <dithering_fragment>', '#include <dithering_fragment>\n' +
          (opt.scan ? 'float scanK = exp(-scanD*scanD*140.0);\ngl_FragColor.rgb += vec3(.32,.64,1.0) * scanK * 2.6;\ngl_FragColor.a = max(gl_FragColor.a, scanK);\n' : '') +
          'if(uSpiegel > .5){ gl_FragColor.a *= smoothstep(-uSpiegelTiefe, 0.0, vWeltPos.y) * uSpiegelStaerke; }');
    };
    m.customProgramCacheKey = () => 'sf-' + (opt.scan ? 's' : 'n');
    return m;
  }

  const titan   = rueste(new THREE.MeshStandardMaterial({color:farbe(0x4A4B52), metalness:.95, roughness:.3}));
  const chrom   = rueste(new THREE.MeshStandardMaterial({color:farbe(0xC2C4CB), metalness:1, roughness:.2}));
  const rippenMat = rueste(new THREE.MeshStandardMaterial({color:farbe(0x1F7AE8), emissive:farbe(0x2E8CFF), emissiveIntensity:1.6, metalness:.1, roughness:.6, transparent:true, opacity:1}));
  const glasRumpf = rueste(new THREE.MeshPhysicalMaterial({color:farbe(0x17181D), metalness:.65, roughness:.16, transparent:true, opacity:.5,
    clearcoat:1, clearcoatRoughness:.06, side:THREE.DoubleSide, depthWrite:false, envMapIntensity:1.6}), {scan:true});
  const deckMat = rueste(new THREE.MeshStandardMaterial({color:farbe(0x201A17), metalness:.2, roughness:.62, side:THREE.DoubleSide}), {scan:true});
  const segelMat = rueste(new THREE.MeshPhysicalMaterial({color:farbe(0xEEF1F6), metalness:0, roughness:.55, transparent:true, opacity:.72,
    side:THREE.DoubleSide, depthWrite:false, emissive:farbe(0x28303A), emissiveIntensity:.35, clearcoat:.4}));
  const segelRot = rueste(new THREE.MeshPhysicalMaterial({color:farbe(ROT), metalness:.1, roughness:.45, transparent:true, opacity:.9,
    side:THREE.DoubleSide, depthWrite:false, emissive:farbe(ROT_LICHT), emissiveIntensity:.35, clearcoat:.6}));
  const laterneRot  = rueste(new THREE.MeshStandardMaterial({color:farbe(ROT), emissive:farbe(ROT_LICHT), emissiveIntensity:3}));
  const laterneWarm = rueste(new THREE.MeshStandardMaterial({color:farbe(0xFFF1DC), emissive:farbe(0xFFE7C4), emissiveIntensity:3}));
  /* Teile, die der Scanner mit dem Rumpf aufbaut */
  const chromScan = rueste(new THREE.MeshStandardMaterial({color:farbe(0xC2C4CB), metalness:1, roughness:.2}), {scan:true});
  const laterneRotS  = rueste(new THREE.MeshStandardMaterial({color:farbe(ROT), emissive:farbe(ROT_LICHT), emissiveIntensity:3}), {scan:true});
  const laterneWarmS = rueste(new THREE.MeshStandardMaterial({color:farbe(0xFFF1DC), emissive:farbe(0xFFE7C4), emissiveIntensity:3}), {scan:true});

  /* Hologrammlinien: Scan, Wasserlinie, Spiegelung */
  function linienMaterial(hex, alpha, scan){
    return new THREE.ShaderMaterial({
      uniforms: Object.assign({uFarbe:{value:farbe(hex)}, uAlpha:{value:alpha}}, geteilt),
      vertexShader: 'varying vec3 vWeltPos; void main(){ vec4 wp = modelMatrix * vec4(position,1.0); vWeltPos = wp.xyz; gl_Position = projectionMatrix * viewMatrix * wp; }',
      fragmentShader: [
        'varying vec3 vWeltPos; uniform vec3 uFarbe; uniform float uAlpha, uZeit, uScan, uSpiegel, uSpiegelTiefe, uSpiegelStaerke;',
        'void main(){',
        '  float echtY = uSpiegel > .5 ? -vWeltPos.y : vWeltPos.y; if(echtY < -0.004) discard;',
        '  float d = vWeltPos.x - uScan;' + (scan ? ' if(d < 0.0) discard;' : ''),
        '  float k = ' + (scan ? 'exp(-d*d*80.0)' : '0.0') + ';',
        '  float puls = .82 + .18*sin(vWeltPos.x*2.4 - uZeit*1.5);',
        '  float a = uAlpha*puls + k;',
        '  vec3 c = uFarbe*(uAlpha*puls) + vec3(.30,.62,1.0)*k*2.8;',
        '  if(uSpiegel > .5){ float f = smoothstep(-uSpiegelTiefe, 0.0, vWeltPos.y)*uSpiegelStaerke; a *= f; c *= f; }',
        '  gl_FragColor = vec4(c, min(a,1.0));',
        '}'].join('\n'),
      transparent:true, depthWrite:false, blending:THREE.AdditiveBlending
    });
  }
  const rumpfLinien = linienMaterial(BEIGE, .5, true);
  const takelLinien = linienMaterial(BEIGE, 0, false);
  const segelLinien = linienMaterial(BEIGE, .35, false);

  /* Scanner-Tor */
  const torMat = new THREE.ShaderMaterial({
    uniforms: Object.assign({uAlpha:{value:0}, uFarbe:{value:farbe(ROT_LICHT)}}, geteilt),
    vertexShader: 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }',
    fragmentShader: [
      'varying vec2 vUv; uniform float uAlpha; uniform vec3 uFarbe;',
      'void main(){',
      '  float e = min(min(vUv.x,1.0-vUv.x), min(vUv.y,1.0-vUv.y)*1.4);',
      '  float rand = exp(-e*e*9000.0);',
      '  float a = (.05 + rand*1.3)*uAlpha;',
      '  gl_FragColor = vec4(uFarbe*(1.0+rand*1.8)*a, a);',
      '}'].join('\n'),
    transparent:true, depthWrite:false, side:THREE.DoubleSide, blending:THREE.CustomBlending,
    blendSrc:THREE.OneFactor, blendDst:THREE.OneFactor
  });

  function radialTextur(){
    const c = document.createElement('canvas'); c.width = c.height = 128;
    const x = c.getContext('2d'); const g = x.createRadialGradient(64,64,0,64,64,64);
    g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(.35,'rgba(255,255,255,.45)'); g.addColorStop(1,'rgba(255,255,255,0)');
    x.fillStyle = g; x.fillRect(0,0,128,128); return new THREE.CanvasTexture(c);
  }
  const texRadial = radialTextur();
  function kurve2(pts){
    const c = new THREE.CatmullRomCurve3(pts.map(p => V(p[0],p[1],0)), false, 'centripetal');
    const s = c.getPoints(800);
    return x => {
      if(x >= s[0].x) return s[0].y;
      for(let i=1;i<s.length;i++) if(x >= s[i].x){ const t = (x - s[i].x)/(s[i-1].x - s[i].x || 1e-6); return s[i].y + (s[i-1].y - s[i].y)*t; }
      return s[s.length-1].y;
    };
  }
  function setze(eltern, geo, material, pos, rot){
    const m = new THREE.Mesh(geo, material);
    if(pos) m.position.set(pos[0],pos[1],pos[2]);
    if(rot) m.rotation.set(rot[0],rot[1],rot[2]);
    eltern.add(m); return m;
  }

  /* ─── Der Rumpf als Loft, Bug bei +x ─── */
  const schiff = new THREE.Group(); welt.add(schiff);
  const BUG = 2.3, HECK = -2.2;
  const pBreite = kurve2([[2.3,0.0],[2.1,.20],[1.7,.44],[1.2,.61],[.5,.70],[-.3,.72],[-1.1,.68],[-1.7,.60],[-2.2,.50]]);
  const pDeck   = kurve2([[2.3,1.08],[2.0,.97],[1.4,.87],[.6,.82],[-.4,.82],[-1.3,.87],[-1.9,.94],[-2.2,1.0]]);
  const pKiel   = kurve2([[2.3,.98],[2.15,.56],[1.9,.12],[1.4,-.16],[.5,-.29],[-.6,-.29],[-1.5,-.19],[-2.0,-.03],[-2.2,.22]]);
  const N_X = 110, N_S = 44;
  function schnitt(x){
    const w = Math.max(pBreite(x), .004), yd = pDeck(x), yk = Math.min(pKiel(x), yd - .02);
    const out = [];
    for(let j=0;j<N_S;j++){
      const a = -Math.PI/2 + Math.PI*j/(N_S-1);
      const s = Math.sin(a), c = Math.cos(a);
      const z = w*s*(1 + .05*(1 - Math.abs(s)));
      const y = yk + (yd - yk)*Math.pow(1 - c, .52);
      out.push(V(x, y, z));
    }
    return out;
  }
  const gitter = [];
  for(let i=0;i<N_X;i++) gitter.push(schnitt(BUG - (BUG - HECK)*i/(N_X-1)));

  (function(){
    const pos = new Float32Array(N_X*N_S*3);
    for(let i=0;i<N_X;i++) for(let j=0;j<N_S;j++){ const p = gitter[i][j], o = (i*N_S+j)*3; pos[o]=p.x; pos[o+1]=p.y; pos[o+2]=p.z; }
    const idx = [];
    for(let i=0;i<N_X-1;i++) for(let j=0;j<N_S-1;j++){ const a = i*N_S+j, b = a+N_S; idx.push(a,b,a+1,a+1,b,b+1); }
    /* Spiegel am Heck schließen */
    const hi = (N_X-1)*N_S; const mitte = pos.length/3;
    const pos2 = new Float32Array(pos.length + 3); pos2.set(pos);
    const hm = gitter[N_X-1][Math.floor(N_S/2)], ho = gitter[N_X-1][0];
    pos2[mitte*3] = HECK; pos2[mitte*3+1] = (hm.y + ho.y)/2; pos2[mitte*3+2] = 0;
    for(let j=0;j<N_S-1;j++) idx.push(mitte, hi+j, hi+j+1);
    idx.push(mitte, hi+N_S-1, hi);
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(pos2,3)); g.setIndex(idx); g.computeVertexNormals();
    schiff.add(new THREE.Mesh(g, glasRumpf));

    const seg = [];
    for(let i=0;i<N_X;i+=3) for(let j=0;j<N_S-1;j++){ const p = gitter[i][j], q = gitter[i][j+1]; seg.push(p.x,p.y,p.z,q.x,q.y,q.z); }
    for(let j=0;j<N_S;j+=3) for(let i=0;i<N_X-1;i++){ const p = gitter[i][j], q = gitter[i+1][j]; seg.push(p.x,p.y,p.z,q.x,q.y,q.z); }
    const lg = new THREE.BufferGeometry(); lg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(seg),3));
    schiff.add(new THREE.LineSegments(lg, rumpfLinien));

    /* Deck als Streifen zwischen den Kanten, Planken als Linien */
    const dp = [], di = [];
    for(let i=0;i<N_X;i++){ const l = gitter[i][0], r = gitter[i][N_S-1]; dp.push(l.x,l.y-.015,l.z*.97, r.x,r.y-.015,r.z*.97); }
    for(let i=0;i<N_X-1;i++){ const a = i*2; di.push(a,a+2,a+1,a+1,a+2,a+3); }
    const dg = new THREE.BufferGeometry(); dg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(dp),3)); dg.setIndex(di); dg.computeVertexNormals();
    schiff.add(new THREE.Mesh(dg, deckMat));
    const pl = [];
    for(let k=1;k<9;k++){ const f = -1 + 2*k/9;
      for(let i=0;i<N_X-1;i++){ const a = gitter[i], b = gitter[i+1];
        pl.push(a[0].x, a[0].y-.01, a[N_S-1].z*f*.95, b[0].x, b[0].y-.01, b[N_S-1].z*f*.95); } }
    const plg = new THREE.BufferGeometry(); plg.setAttribute('position', new THREE.BufferAttribute(new Float32Array(pl),3));
    schiff.add(new THREE.LineSegments(plg, rumpfLinien));

    /* Reling: polierte Rohre entlang der Deckskante */
    [0, N_S-1].forEach(j => {
      const pts = gitter.map(r => V(r[j].x, r[j].y + .09, r[j].z*.98));
      setze(schiff, new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 160, .009, 6, false), chromScan);
      for(let i=4;i<N_X-3;i+=7){ const p = gitter[i][j];
        setze(schiff, new THREE.CylinderGeometry(.006,.006,.09,6), chromScan, [p.x, p.y+.045, p.z*.98]); }
    });
  })();

  /* ─── Kiel und Spanten: zeichnen sich selbst entlang ihres Wegs ─── */
  const rippen = [];
  (function(){
    const kielPts = [];
    for(let i=0;i<N_X;i++) kielPts.push(gitter[i][Math.floor(N_S/2)].clone());
    const kiel = setze(schiff, new THREE.TubeGeometry(new THREE.CatmullRomCurve3(kielPts), 200, .022, 8, false), rippenMat);
    rippen.push({m:kiel, von:0, bis:.35});
    const n = 16;
    for(let k=0;k<n;k++){
      const i = Math.round(3 + (N_X-7)*k/(n-1));
      const pts = gitter[i].map(p => p.clone());
      const r = setze(schiff, new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 64, .013, 6, false), rippenMat);
      const von = .25 + .55*k/(n-1);
      rippen.push({m:r, von, bis:von + .22});
      /* Decksbalken quer */
      const a = gitter[i][0], b = gitter[i][N_S-1];
      const bal = setze(schiff, new THREE.TubeGeometry(new THREE.LineCurve3(V(a.x,a.y-.02,a.z), V(b.x,b.y-.02,b.z)), 8, .009, 6, false), rippenMat);
      rippen.push({m:bal, von:von + .12, bis:von + .3});
    }
    rippen.forEach(o => { o.n = o.m.geometry.index.count; o.m.geometry.setDrawRange(0,0); });
  })();

  /* ─── Masten, Bäume, Bugspriet ─── */
  const DECK_Y = .82;
  const masten = [];
  function mast(x, hoehe){
    const g = new THREE.Group(); g.position.set(x, DECK_Y, 0); schiff.add(g);
    const geo = new THREE.CylinderGeometry(.03,.045,hoehe,16); geo.translate(0,hoehe/2,0);
    setze(g, geo, titan);
    setze(g, new THREE.TorusGeometry(.07,.01,8,24), chrom, [0,hoehe*.62,0], [Math.PI/2,0,0]);
    setze(g, new THREE.CylinderGeometry(.11,.08,.08,20,1,true), titan, [0,hoehe*.62-.04,0]);
    setze(g, new THREE.SphereGeometry(.035,12,10), laterneWarm, [0,hoehe+.03,0]);
    masten.push({g, hoehe}); return g;
  }
  const vormast = mast(.9, 3.35);
  const grossmast = mast(-.55, 3.95);
  const bugspriet = new THREE.Group(); bugspriet.position.set(2.18, 1.0, 0); bugspriet.rotation.z = .2; schiff.add(bugspriet);
  (function(){ const g = new THREE.CylinderGeometry(.018,.03,1.3,12); g.rotateZ(-Math.PI/2); g.translate(.65,0,0); setze(bugspriet, g, titan); })();
  function baum(von, bis, y){
    const g = new THREE.Group(); g.position.set(von, DECK_Y + y, 0); schiff.add(g);
    const geo = new THREE.CylinderGeometry(.02,.026,Math.abs(bis-von),10); geo.rotateZ(Math.PI/2); geo.translate((bis-von)/2,0,0);
    setze(g, geo, titan); return g;
  }
  const baumVor = baum(.9, -.38, .46), baumGross = baum(-.55, -2.3, .48);

  /* Laternen */
  setze(schiff, new THREE.SphereGeometry(.05,14,12), laterneRotS, [-2.24, 1.12, 0]);
  setze(schiff, new THREE.SphereGeometry(.04,14,12), laterneWarmS, [2.25, 1.16, 0]);

  /* ─── Takelage: Linien von den Masttopps ─── */
  const TOP_V = V(.9, DECK_Y + 3.35), TOP_G = V(-.55, DECK_Y + 3.95), SPRIET = V(3.4, 1.26);
  (function(){
    const seg = [];
    const l = (a,b) => seg.push(a.x,a.y,a.z,b.x,b.y,b.z);
    l(TOP_G, TOP_V); l(TOP_V, SPRIET); l(TOP_G, V(-2.2, 1.02)); l(V(.9, DECK_Y+2.1), SPRIET);
    [[.9,TOP_V],[-.55,TOP_G]].forEach(([x,top]) => {
      const w = pBreite(x);
      for(const dx of [-.22,0,.22]) for(const s of [-1,1]) l(top, V(x+dx, pDeck(x+dx)+.08, s*w*.98));
    });
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(new Float32Array(seg),3));
    schiff.add(new THREE.LineSegments(g, takelLinien));
  })();

  /* ─── Segel: Dreiecke aus Hals, Kopf und Schothorn, gewölbt vom Wind ─── */
  const segel = [];
  function segelBauen(A, B, C, mat, eltern, bauch){
    const U = 16, W = 22;
    const pos = new Float32Array(U*W*3);
    const idx = [];
    for(let v=0;v<W-1;v++) for(let u=0;u<U-1;u++){ const a = v*U+u, b = a+U; idx.push(a,b,a+1,a+1,b,b+1); }
    const g = new THREE.BufferGeometry();
    const attr = new THREE.BufferAttribute(pos,3); attr.setUsage(THREE.DynamicDrawUsage);
    g.setAttribute('position', attr); g.setIndex(idx);
    const m = new THREE.Mesh(g, mat); m.frustumCulled = false; eltern.add(m);
    const li = [];
    for(let v=0;v<W;v+=3) for(let u=0;u<U-1;u++){ li.push(v*U+u, v*U+u+1); }
    for(let u=0;u<U;u+=3) for(let v=0;v<W-1;v++){ li.push(v*U+u, (v+1)*U+u); }
    const lg = new THREE.BufferGeometry(); lg.setAttribute('position', attr); lg.setIndex(li);
    const lm = new THREE.LineSegments(lg, segelLinien); lm.frustumCulled = false; eltern.add(lm);
    const s = {A,B,C,U,W,g,attr,bauch,ph:Math.random()*6}; segel.push(s); return s;
  }
  function segelFormen(s, hoch, wind, t){
    const p = s.attr.array; const {A,B,C,U,W} = s;
    for(let v=0;v<W;v++){
      const fv = v/(W-1), vh = fv*hoch;
      for(let u=0;u<U;u++){
        const fu = u/(U-1), o = (v*U+u)*3;
